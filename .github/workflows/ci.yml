# CI: Firebase Functions (typecheck + build + emulator security suite) and a
# paths-gated iOS build.
#
# functions job — every PR and every push to main.
# ios job       — only when files under ios/** (or the iOS CI scripts) changed (macOS runners are slow
#                 and expensive; the cheap `changes` job on ubuntu decides).

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (new push to a PR branch kills the
# in-flight run for the old head).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files via the API

jobs:
  functions:
    name: functions (tsc + build + security suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Functions deploy on the nodejs22 2nd-gen runtime (firebase.json +
          # functions/package.json "engines") — CI must match.
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator is a Java jar.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        working-directory: functions
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: functions
        run: npm run check

      - name: Build (tsc)
        working-directory: functions
        run: npm run build

      # appCheckEnforcement.test.ts is INCLUDED: enforcement became env-gated
      # (PR #5), the test pins the contract both ways, and the suite is fully
      # green on main.

      - name: Static security lint (no emulator)
        working-directory: functions
        run: npm run lint:security

      - name: Security suite (Firestore emulator)
        # Run from the repo root so firebase-tools picks up firebase.json.
        run: |
          npx firebase-tools emulators:exec --only firestore --project demo-ironboi-security \
            "cd functions && npx vitest run test/security --fileParallelism=false"

  # Cheap ubuntu job that decides whether the expensive macOS job runs at all.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      # Needed for push events (paths-filter diffs against the pre-push
      # commit); PR events use the GitHub API instead.
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'scripts/ios-*.sh'
              - '.github/workflows/ci.yml'

  ios:
    name: ios (xcodebuild, simulator, no signing)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # macos-15 required: the project is objectVersion 77 (Xcode 16.3+ format);
    # macos-14's Xcode 15 cannot open it.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ios/IronBoi/IronBoi.xcodeproj (project.pbxproj + shared IronBoi
      # scheme) is committed, so no xcodegen step is needed even though
      # ios/IronBoi/project.yml exists. The "Select GoogleService-Info.plist"
      # pre-build phase copies the committed Staging plist into place for
      # Debug builds, so a clean checkout builds without secrets.
      - name: Show Xcode version
        run: xcodebuild -version

      # The Coach orb is a Metal shader (Features/Coach/Orb/OneBody.metal).
      # Xcode 26 ships the Metal compiler as a separate download; older Xcodes
      # bundle it, so this is a no-op there. `xcrun --find metal` finds a stub
      # either way — only running it tells you whether it works.
      - name: Ensure Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      # The iPhone app embeds the MYO Watch app (ios/IronBoi/MYOWatch), so
      # both builds need the watchOS simulator platform. Runner images
      # usually ship it; download it only when it's missing.
      - name: Ensure watchOS platform
        run: xcrun simctl list runtimes | grep -q watchOS || xcodebuild -downloadPlatform watchOS

      # Fails fast if project.yml or the committed project stops bundling
      # GoogleService-Info.plist (F40, #54).
      - name: Preflight (GoogleService-Info.plist listed)
        run: scripts/ios-ci-preflight.sh

      # Plain-Swift checks (Watch messages, zones, BLE parsing); no simulator.
      - name: Host tests
        run: scripts/ios-host-tests.sh

      - name: Build (Debug, iOS Simulator)
        run: >-
          xcodebuild
          -project ios/IronBoi/IronBoi.xcodeproj
          -scheme IronBoi
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          -derivedDataPath build/DerivedData
          build
          CODE_SIGNING_ALLOWED=NO

      # F40: the build succeeds without the plist; the app then aborts in
      # FIRApp configure. Check the product, not just the project.
      - name: Bundle check (GoogleService-Info.plist in IronBoi.app)
        run: |
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/IronBoi.app
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }
          if [ ! -f "$APP/GoogleService-Info.plist" ]; then
            echo "::error::GoogleService-Info.plist is not inside IronBoi.app; Firebase aborts at launch (F40)."
            exit 1
          fi
          /usr/bin/plutil -lint "$APP/GoogleService-Info.plist"

      # F40/F42 both crashed in App.init and passed a build-only CI. Install,
      # launch, fail if the app is dead or left a crash report after 10 s.
      # Newest runtime on the newest Xcode the runner has (F42 only crashed
      # on iOS 26), then the oldest runtime of the default Xcode (closest to
      # the iOS 17 deployment target that needs no download).
      - name: Launch smoke test (newest iOS runtime)
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' | grep -E '^[0-9]' | sort -V | tail -1 | cut -d' ' -f2- || true)
          if [ -n "$NEWEST" ] && DEVELOPER_DIR="$NEWEST/Contents/Developer" xcrun simctl list runtimes available | grep '^iOS' >/dev/null; then
            export DEVELOPER_DIR="$NEWEST/Contents/Developer"
          fi
          xcodebuild -version
          scripts/ios-launch-smoke.sh build/DerivedData/Build/Products/Debug-iphonesimulator/IronBoi.app

      - name: Launch smoke test (oldest iOS runtime, default Xcode)
        run: scripts/ios-launch-smoke.sh build/DerivedData/Build/Products/Debug-iphonesimulator/IronBoi.app oldest

      # Pure-logic unit tests (no app host, no backend): the rep-count state
      # machine. Needs a concrete simulator, not the generic destination.
      - name: Unit tests (IronBoiTests, iOS Simulator)
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild \
            -project ios/IronBoi/IronBoi.xcodeproj \
            -scheme IronBoiTests \
            -destination "id=$SIM" \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Watch app (Debug, watchOS Simulator)
        run: >-
          xcodebuild
          -project ios/IronBoi/IronBoi.xcodeproj
          -scheme MYOWatch
          -destination 'generic/platform=watchOS Simulator'
          -configuration Debug
          build
          CODE_SIGNING_ALLOWED=NO
