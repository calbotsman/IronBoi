name: IronBoi
options:
  bundleIdPrefix: com.thecombinationrule
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
# Shared by the phone app and the Watch app: an embedded Watch app must carry
# the same version and build number as its iPhone app, or install fails.
# scripts/ios-bump-build.sh edits this line.
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 56
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
targets:
  IronBoi:
    type: application
    platform: iOS
    sources:
      - path: IronBoi
        excludes:
          - GoogleService-Info.plist
      # Written by the prebuild script below and gitignored, so a fresh
      # checkout doesn't have it when xcodegen runs. Listed on its own as
      # optional so the project always bundles it; without it Firebase
      # aborts at launch (crash on 2026-11-05).
      - path: IronBoi/GoogleService-Info.plist
        optional: true
        buildPhase: resources
      - path: MYOShared
    info:
      path: IronBoi/Info.plist
      properties:
        # Coach keeps talking and listening with the screen off or the
        # phone in a pocket; the audio session carries the app.
        # bluetooth-central: a heart-rate strap keeps streaming with the
        # screen off (Services/HeartStrapConnector.swift).
        UIBackgroundModes: [audio, bluetooth-central]
    preBuildScripts:
      - name: "Select GoogleService-Info.plist for $CONFIGURATION"
        script: |
          # Pick staging or prod GoogleService-Info.plist based on the
          # active build configuration. The Firebase SDK reads this file
          # at FirebaseApp.configure() time; one wrong file = users
          # routed to the wrong project.
          set -euo pipefail

          case "$CONFIGURATION" in
            Debug)   SUFFIX=Staging ;;
            Release) SUFFIX=Prod ;;
            *)       SUFFIX=Staging ;;
          esac

          SOURCE="$PROJECT_DIR/IronBoi/Firebase/GoogleService-Info-$SUFFIX.plist"

          if [ ! -f "$SOURCE" ]; then
            echo "error: $SOURCE not found — see ios/IronBoi/IronBoi/Firebase/README.md"
            exit 1
          fi

          # Safety net: if the Release build would otherwise ship the
          # placeholder prod plist (Firebase init would fail at runtime),
          # fall back to staging. This lets you TestFlight before the
          # ironboi-prod Firebase project exists.
          #
          # This CANNOT tell a TestFlight build from an App Store build:
          # both use the Release configuration and produce the identical
          # archive — the destination is chosen afterwards, in Organizer.
          # So the gate is the MARKETING_VERSION instead. While the app is
          # 0.x the fallback is a convenience and only warns; the moment
          # someone bumps to 1.0.0 they have decided this ships to the
          # public, and shipping real users into a project named "staging"
          # stops being a convenience and becomes a data problem. From 1.0
          # on, a placeholder prod plist fails the build.
          #
          # A warning nobody reads is not a safeguard. `scripts/preflight-appstore.sh`
          # is the deliberate pre-submission check; this is the backstop for
          # when that is skipped.
          # Two things must be true before a Release build may use prod:
          # the prod plist is real, AND ironboi-prod is actually serving
          # (Auth providers on, Firestore + Functions deployed, secrets
          # set) — recorded by the marker file Firebase/PROD_READY. A real
          # plist on its own just routes testers into an empty project
          # ("internal error" at sign-in; build 38, 2026-10-12).
          READY="$PROJECT_DIR/IronBoi/Firebase/PROD_READY"
          if [ "$SUFFIX" = "Prod" ] && { grep -q "REPLACE_WITH_PROD" "$SOURCE" || [ ! -f "$READY" ]; }; then
            case "${MARKETING_VERSION:-0}" in
              0|0.*) PRERELEASE=1 ;;
              *)     PRERELEASE=0 ;;
            esac

            if [ "$PRERELEASE" = "0" ]; then
              echo "error: MARKETING_VERSION is ${MARKETING_VERSION:-unset} (1.0 or later) but prod is not ready (placeholder GoogleService-Info-Prod.plist, or no Firebase/PROD_READY marker)."
              echo "error: A 1.x build is a public release, and the staging fallback would point real users at the ironboi-staging Firebase project."
              echo "error: Create the ironboi-prod project, drop in its real GoogleService-Info.plist, and run scripts/preflight-appstore.sh. See ios/IronBoi/IronBoi/Firebase/README.md."
              exit 1
            fi

            FALLBACK="$PROJECT_DIR/IronBoi/Firebase/GoogleService-Info-Staging.plist"
            if [ -f "$FALLBACK" ]; then
              echo "warning: ironboi-prod is not ready (placeholder plist or no Firebase/PROD_READY marker). Falling back to STAGING for this Release build. Fine for TestFlight; run scripts/preflight-appstore.sh before any public App Store submission. See ios/IronBoi/IronBoi/Firebase/README.md."
              SOURCE="$FALLBACK"
            else
              echo "error: Prod plist is a placeholder AND staging fallback is missing. See ios/IronBoi/IronBoi/Firebase/README.md."
              exit 1
            fi
          fi

          DEST="$PROJECT_DIR/IronBoi/GoogleService-Info.plist"

          if ! cmp -s "$SOURCE" "$DEST"; then
            cp -f "$SOURCE" "$DEST"
            echo "Selected $(basename "$SOURCE") → GoogleService-Info.plist"
          fi
        inputFiles:
          - $(PROJECT_DIR)/IronBoi/Firebase/GoogleService-Info-Staging.plist
          - $(PROJECT_DIR)/IronBoi/Firebase/GoogleService-Info-Prod.plist
          - $(PROJECT_DIR)/IronBoi/Firebase/PROD_READY
        outputFiles:
          - $(PROJECT_DIR)/IronBoi/GoogleService-Info.plist
    dependencies:
      # The Watch app, embedded in Watch/ (docs/product/responsive-coach-plan.md §2).
      - target: MYOWatch
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
    settings:
      base:
        # Team ID baked in so xcodegen doesn't wipe it on regenerate.
        # If you're a different developer, change to your team's ID
        # (Apple Developer → Membership) or pass via xcconfig override.
        DEVELOPMENT_TEAM: SGQ2WLB6M9
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.thecombinationrule.ironboi
        PRODUCT_NAME: IronBoi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MYO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # HTTPS only, no custom crypto: exempt. Answers App Store Connect's
        # export-compliance question so it isn't asked on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: MYO uses the microphone so you can speak to your coach.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: MYO saves your finished workouts to Apple Health so they count toward your activity.
        # Read: live heart rate and active energy from a Watch workout (Services/WatchWorkoutLink.swift).
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: MYO connects to your heart rate strap so your coach can pace your rests.
        INFOPLIST_KEY_NSHealthShareUsageDescription: MYO reads your heart rate and active energy during workouts so your coach can pace your rests.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: MYO uses speech recognition to turn your voice into coach messages.
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: 1
      configs:
        # Debug builds (Xcode Run, internal device builds) talk to staging.
        Debug:
          INFOPLIST_KEY_IronBoiCallableBaseURL: https://us-central1-ironboi-staging.cloudfunctions.net
        # Release builds (archive → TestFlight → App Store) talk to prod.
        # Change this URL if the prod Firebase project id differs.
        Release:
          INFOPLIST_KEY_IronBoiCallableBaseURL: https://us-central1-ironboi-prod.cloudfunctions.net
    scheme:
      testTargets: []
      environmentVariables:
        # Pin the App Check debug token so it survives reinstalls and
        # simulator resets. Register this ONE token in Firebase Console →
        # App Check → IronBoi (iOS) → Manage debug tokens, once, and Debug
        # builds authenticate forever after. Without this the SDK mints a
        # fresh token per install and every console registration goes
        # stale. Staging-only credential; rotate in console if leaked.
        - variable: FIRAAppCheckDebugToken
          value: 7B49E8DA-2CDA-4A4C-8C9E-93D1C5A40F11
          isEnabled: true
    entitlements:
      path: IronBoi/IronBoi.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Phase 3 Task 3.2 — App Attest. Use "development" while testing
        # via TestFlight; switch to "production" when shipping to public
        # App Store. The Firebase AppAttestProvider reads this and routes
        # to Apple's matching attestation endpoint.
        com.apple.developer.devicecheck.appattest-environment: production
        # Finished workouts go to Apple Health (Services/HealthSync.swift); a
        # Watch workout's heart rate and energy are read live (WatchWorkoutLink).
        com.apple.developer.healthkit: true

  # The Watch app: started by the phone's Start (HKHealthStore.startWatchApp),
  # runs the HKWorkoutSession, mirrors it to the phone and saves the workout.
  # Single target, SwiftUI, no Firebase: the phone is the only thing that
  # talks to the backend. docs/product/responsive-coach-plan.md §2.
  MYOWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MYOWatch
      - path: MYOShared
    info:
      path: MYOWatch/Info.plist
      properties:
        CFBundleDisplayName: MYO
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.thecombinationrule.ironboi
        # Keeps the app running through the workout session.
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: MYO reads your heart rate and active energy during workouts so your coach can pace your rests.
        NSHealthUpdateUsageDescription: MYO saves your workouts to Apple Health with heart rate and active energy.
    settings:
      base:
        DEVELOPMENT_TEAM: SGQ2WLB6M9
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.thecombinationrule.ironboi.watchkitapp
        PRODUCT_NAME: MYOWatch
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Shared scheme so CI can build the Watch app on its own.
    scheme: {}
    entitlements:
      path: MYOWatch/MYOWatch.entitlements
      properties:
        com.apple.developer.healthkit: true

  # Logic tests that need no app, simulator audio or backend: they compile
  # the few pure files they test directly. Run the "IronBoiTests" scheme.
  IronBoiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IronBoiTests
      - path: IronBoi/Features/Coach/SetCount.swift
      - path: IronBoi/Features/Coach/Atmosphere/Effort.swift
      - path: IronBoi/Models/UserProfile.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.10

# A second scheme for tuning the blob's physics in the simulator: no backend,
# no mic, the stunt reel on loop and the live tuner (DEBUG only). Pick
# "IronBoi Reel" in Xcode and Run; see docs/design/orb-physics-tuning.md.
schemes:
  IronBoi Reel:
    build:
      targets:
        IronBoi: all
    run:
      config: Debug
      environmentVariables:
        - variable: FIRAAppCheckDebugToken
          value: 7B49E8DA-2CDA-4A4C-8C9E-93D1C5A40F11
          isEnabled: true
        - variable: MYO_PREVIEW
          value: "1"
          isEnabled: true
        - variable: MYO_REEL
          value: "1"
          isEnabled: true
        - variable: MYO_NO_MIC
          value: "1"
          isEnabled: true
        - variable: MYO_TUNER
          value: "1"
          isEnabled: true
  IronBoiTests:
    build:
      targets:
        IronBoiTests: all
    test:
      targets:
        - IronBoiTests
  # The workout screen's atmosphere without a Watch: the preview straight
  # into a workout, a pretend heart rate rising and falling (DEBUG only;
  # MYO_HR_SIM=calm|pumped|follow|wave, see HeartRateSimulator.swift).
  IronBoi Heart:
    build:
      targets:
        IronBoi: all
    run:
      config: Debug
      environmentVariables:
        - variable: FIRAAppCheckDebugToken
          value: 7B49E8DA-2CDA-4A4C-8C9E-93D1C5A40F11
          isEnabled: true
        - variable: MYO_PREVIEW
          value: "1"
          isEnabled: true
        - variable: MYO_NO_MIC
          value: "1"
          isEnabled: true
        - variable: MYO_HR_SIM
          value: wave
          isEnabled: true
