		EAA3A21E0CD9BEC957F0918C /* Select GoogleService-Info.plist for $CONFIGURATION */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"$(PROJECT_DIR)/IronBoi/Firebase/GoogleService-Info-Staging.plist",
				"$(PROJECT_DIR)/IronBoi/Firebase/GoogleService-Info-Prod.plist",
				"$(PROJECT_DIR)/IronBoi/Firebase/PROD_READY",
			);
			name = "Select GoogleService-Info.plist for $CONFIGURATION";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(PROJECT_DIR)/IronBoi/GoogleService-Info.plist",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Pick staging or prod GoogleService-Info.plist based on the\n# active build configuration. The Firebase SDK reads this file\n# at FirebaseApp.configure() time; one wrong file = users\n# routed to the wrong project.\nset -euo pipefail\n\ncase \"$CONFIGURATION\" in\n  Debug)   SUFFIX=Staging ;;\n  Release) SUFFIX=Prod ;;\n  *)       SUFFIX=Staging ;;\nesac\n\nSOURCE=\"$PROJECT_DIR/IronBoi/Firebase/GoogleService-Info-$SUFFIX.plist\"\n\nif [ ! -f \"$SOURCE\" ]; then\n  echo \"error: $SOURCE not found — see ios/IronBoi/IronBoi/Firebase/README.md\"\n  exit 1\nfi\n\n# Safety net: if the Release build would otherwise ship the\n# placeholder prod plist (Firebase init would fail at runtime),\n# fall back to staging. This lets you TestFlight before the\n# ironboi-prod Firebase project exists.\n#\n# This CANNOT tell a TestFlight build from an App Store build:\n# both use the Release configuration and produce the identical\n# archive — the destination is chosen afterwards, in Organizer.\n# So the gate is the MARKETING_VERSION instead. While the app is\n# 0.x the fallback is a convenience and only warns; the moment\n# someone bumps to 1.0.0 they have decided this ships to the\n# public, and shipping real users into a project named \"staging\"\n# stops being a convenience and becomes a data problem. From 1.0\n# on, a placeholder prod plist fails the build.\n#\n# A warning nobody reads is not a safeguard. `scripts/preflight-appstore.sh`\n# is the deliberate pre-submission check; this is the backstop for\n# when that is skipped.\n# Two things must be true before a Release build may use prod:\n# the prod plist is real, AND ironboi-prod is actually serving\n# (Auth providers on, Firestore + Functions deployed, secrets\n# set) — recorded by the marker file Firebase/PROD_READY. A real\n# plist on its own just routes testers into an empty project\n# (\"internal error\" at sign-in; build 38, 2026-10-12).\nREADY=\"$PROJECT_DIR/IronBoi/Firebase/PROD_READY\"\nif [ \"$SUFFIX\" = \"Prod\" ] && { grep -q \"REPLACE_WITH_PROD\" \"$SOURCE\" || [ ! -f \"$READY\" ]; }; then\n  case \"${MARKETING_VERSION:-0}\" in\n    0|0.*) PRERELEASE=1 ;;\n    *)     PRERELEASE=0 ;;\n  esac\n\n  if [ \"$PRERELEASE\" = \"0\" ]; then\n    echo \"error: MARKETING_VERSION is ${MARKETING_VERSION:-unset} (1.0 or later) but prod is not ready (placeholder GoogleService-Info-Prod.plist, or no Firebase/PROD_READY marker).\"\n    echo \"error: A 1.x build is a public release, and the staging fallback would point real users at the ironboi-staging Firebase project.\"\n    echo \"error: Create the ironboi-prod project, drop in its real GoogleService-Info.plist, and run scripts/preflight-appstore.sh. See ios/IronBoi/IronBoi/Firebase/README.md.\"\n    exit 1\n  fi\n\n  FALLBACK=\"$PROJECT_DIR/IronBoi/Firebase/GoogleService-Info-Staging.plist\"\n  if [ -f \"$FALLBACK\" ]; then\n    echo \"warning: ironboi-prod is not ready (placeholder plist or no Firebase/PROD_READY marker). Falling back to STAGING for this Release build. Fine for TestFlight; run scripts/preflight-appstore.sh before any public App Store submission. See ios/IronBoi/IronBoi/Firebase/README.md.\"\n    SOURCE=\"$FALLBACK\"\n  else\n    echo \"error: Prod plist is a placeholder AND staging fallback is missing. See ios/IronBoi/IronBoi/Firebase/README.md.\"\n    exit 1\n  fi\nfi\n\nDEST=\"$PROJECT_DIR/IronBoi/GoogleService-Info.plist\"\n\nif ! cmp -s \"$SOURCE\" \"$DEST\"; then\n  cp -f \"$SOURCE\" \"$DEST\"\n  echo \"Selected $(basename \"$SOURCE\") → GoogleService-Info.plist\"\nfi\n";
		};
